name: commits

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Checks every commit of a pull request: Conventional Commits subject and no
# automated attribution trailer. Pull requests from forks run on a hosted
# runner; the runner of the repository comes from a repository variable.

jobs:
  commits:
    name: commits / conventional commits
    runs-on: ${{ fromJSON(vars.RD_CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cc='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          marks='(generated[[:space:]]+(with|by)[[:space:]])|(assisted[[:space:]]+by[[:space:]])|(^co-authored-by:.*noreply)'
          robot=$(printf '\xf0\x9f\xa4\x96')
          bad=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format='%s' "$sha")
            body=$(git log -1 --format='%B' "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$cc"; then
              echo "::error::$sha: subject is not a Conventional Commit: '$subject'"
              bad=1
            fi
            if printf '%s' "$body" | grep -iEq "$marks" || printf '%s' "$body" | grep -Fq "$robot"; then
              echo "::error::$sha: commit message carries a forbidden trailer or marker"
              bad=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit "$bad"
