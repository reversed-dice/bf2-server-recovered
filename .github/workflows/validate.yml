name: validate

# The judge of every pull request the reversed-dice API opens: only
# recovered/*.cpp may be added or modified, an address may not get a second
# file, and every file must byte-match with the flags it declares (api
# validate, in the deployed worker image: same code as the submissions).
# Runs only when a pull request touches recovered/ (a change to anything else
# has nothing to judge, and used to show up as a red check). The API merges its
# own submit/* branches once this passes; the merge job below does the same for
# any other branch of the repository, then deletes the branch.

on:
  pull_request:
    branches: [main]
    paths: [recovered/**]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: [self-hosted, rd, validate]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The merge commit of the pull request: its two parents are the base
          # and the head, all the job diffs. Full history cost 4 GB per runner.
          fetch-depth: 2

      - name: Changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-status --no-renames "$BASE" HEAD > changes.txt
          cat changes.txt
          if grep -vE '^[AM][[:space:]]+recovered/0x[0-9a-f]+(__[A-Za-z0-9_]+)?\.cpp$' changes.txt; then
            echo "::error::only added or modified recovered/0x<addr>__<name>.cpp files are accepted"
            exit 1
          fi
          cut -f2 changes.txt > files.txt
          # An address gets one file: a new file for an address that already
          # has one on the base branch is refused.
          git ls-tree -r --name-only "$BASE" recovered/ | sed -E 's#^recovered/(0x[0-9a-f]+).*#\1#' | sort -u > base_addrs.txt
          bad=0
          while read -r f; do
            a=$(basename "$f" | grep -oE '^0x[0-9a-f]+')
            if grep -q "^A" <(grep -F "$f" changes.txt) && grep -qx "$a" base_addrs.txt; then
              echo "::error::$a already has a file on the base branch ($f)"
              bad=1
            fi
          done < files.txt
          exit "$bad"

      - name: Byte-match
        run: |
          set -euo pipefail
          tag=$(cat /srv/reversed-dice/worker/current_tag)
          # shellcheck disable=SC2046
          docker run --rm --network rd-internal --env-file /srv/reversed-dice/worker/.env \
            -v /srv/reversed-dice/toolchains:/toolchains:ro -v "$PWD":/src:ro -w /src \
            --read-only --tmpfs /tmp --cap-drop ALL --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true -e RD_COMPILE_UID=65534 \
            --entrypoint /api "rd-worker:$tag" validate $(cat files.txt) 2>&1 | tee result.txt

      - name: Compact the workspace
        if: always()
        run: git gc --prune=now --quiet

      - name: Report on the pull request
        if: always() && hashFiles('result.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo '```'; tail -c 60000 result.txt; echo '```'; } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md

  merge:
    needs: validate
    # submit/* is the API's: it merges with the Submitted-by trailers.
    if: ${{ !startsWith(github.head_ref, 'submit/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, rd, ci]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge and delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cc='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          printf '%s' "$TITLE" | grep -Eq "$cc" || { echo "::error::PR title is not a Conventional Commit"; exit 1; }
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA" --subject "$TITLE (#$PR)"
